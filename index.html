<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krisha</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --navy: #1a237e; --gold: #d4af37; --bg: #f0f2f5; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* Login - No Hints */
        #loginOverlay { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: #ff6f00; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Header */
        .app-header { background: var(--navy); color: white; padding: 20px 15px; text-align: center; border-bottom: 4px solid var(--gold); }
        .header-title { font-size: 22px; font-weight: bold; }
        .header-datetime { font-size: 13px; color: var(--gold); margin-top: 8px; font-weight: bold; }

        /* Dashboard Buttons - Navy Blue with Black Font */
        .nav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .nav-item { background: var(--navy); padding: 25px 10px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; border: 2px solid var(--gold); }
        .nav-item span { font-weight: bold; font-size: 14px; color: #000000; display: block; margin-top: 8px; }

        /* Page Layout */
        .app-page { display: none; padding: 15px; min-height: 80vh; padding-bottom: 80px; }
        .active-page { display: block; }
        .section-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* Table */
        .table-wrapper { overflow-x: auto; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background: var(--navy); color: white; padding: 10px; text-align: left; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; color: #000; }
        .court-header { background: #e3f2fd; font-weight: bold; padding: 12px; color: var(--navy); border-radius: 5px; margin-top: 15px; text-align: center; border: 1px solid #ddd; }

        /* Back Button */
        .btn-back { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: #000; border: 2px solid var(--gold); padding: 12px 25px; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000; }

        label { font-size: 11px; font-weight: bold; color: #333; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; color: #000; }
        .btn-save { background: #2e7d32; color: #000; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--navy); margin-top:0;">KRISHA LOGIN</h2>
        <input type="text" id="userInput">
        <input type="password" id="passInput">
        <button onclick="checkLogin()">LOGIN</button>
    </div>
</div>

<div id="appMain" style="display:none;">
    <div class="app-header">
        <div class="header-title">KANJI M. GARCHAR</div>
        <div id="liveClock" class="header-datetime">Loading...</div>
    </div>

    <div id="dash" class="app-page active-page">
        <div class="nav-grid">
            <div class="nav-item" onclick="openPage('add')"><span>ADD CASE</span></div>
            <div class="nav-item" onclick="openPage('board')"><span>DAILY BOARD</span></div>
            <div class="nav-item" onclick="openPage('revenue')"><span>REVENUE</span></div>
            <div class="nav-item" onclick="openPage('civil')"><span>CIVIL</span></div>
            <div class="nav-item" onclick="window.print()"><span>PRINT BOARD</span></div>
            <div class="nav-item" onclick="exportToExcel()"><span>BACKUP</span></div>
        </div>
    </div>

    <div id="page-add" class="app-page">
        <div class="section-card">
            <h3 style="margin:0; color:var(--navy); text-align:center;">NEW CASE RECORD</h3>
            
            <label>PREV. DATE</label><input type="date" id="prevDate">
            <label>COURT</label>
            <select id="courtName">
                <option value="Pdj Court">Pdj Court</option><option value="Adj Court">Adj Court</option>
                <option value="2nd Adj Court">2nd Adj Court</option><option value="Family Court">Family Court</option>
                <option value="JMFC Court">JMFC Court</option><option value="Chief Court">Chief Court</option>
                <option value="2nd addi.chief court">2nd addi.chief court</option>
                <option value="3rd addi.chief court">3rd addi.chief court</option>
                <option value="4th addi.chief court">4th addi.chief court</option>
                <option value="Principal Senior Civil">Principal Senior Civil</option>
                <option value="JMFC Court Tankara">JMFC Court Tankara</option>
                <option value="JMFC Court Maliya">JMFC Court Maliya</option>
                <option value="Halvad Court">Halvad Court</option>
            </select>
            <label>TYPE</label>
            <select id="caseType">
                <option value="cc">cc</option><option value="cram s">cram s</option><option value="crma j">crma j</option>
                <option value="cr.en">cr.en</option><option value="s.c.">s.c.</option><option value="cma-dc">cma-dc</option>
                <option value="cma-sc">cma-sc</option><option value="Rcs">Rcs</option><option value="rca">rca</option>
                <option value="spcs">spcs</option><option value="cri.apl">cri.apl</option><option value="comm.ex">comm.ex</option>
                <option value="comm.sc">comm.sc</option><option value="comm.cma">comm.cma</option><option value="cr.RA">cr.RA</option>
                <option value="F suit">F suit</option><option value="Glgp">Glgp</option><option value="Macp">Macp</option>
                <option value="Mca">Mca</option><option value="Pocso">Pocso</option><option value="Atro">Atro</option>
            </select>
            <label>CASE NO.</label><input type="text" id="caseNo">
            <label>PARTY NAME</label><input type="text" id="partyName">
            <label>OPP. PARTY</label><input type="text" id="oppParty">
            <label>STAGE</label><input type="text" id="stage">
            <label>NEXT DATE</label><input type="date" id="nextDate">
            <label>MOBILE NO.</label><input type="text" id="phone">
            <label>TOTAL FEE</label><input type="number" id="totalFee" value="0">
            <label>PAID FEE</label><input type="number" id="paidFee" value="0">
            <label>REMARKS</label><textarea id="caseNotes"></textarea>

            <button class="btn-save" onclick="addRecord()">SAVE RECORD</button>
        </div>
        <button class="btn-back" onclick="openPage('dash')">BACK</button>
    </div>

    <div id="page-board" class="app-page">
        <div class="section-card">
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="renderTable()">
            <input type="date" id="calFilter" onchange="renderTable()">
        </div>
        <div id="tableWrapper"></div>
        <button class="btn-back" onclick="openPage('dash')">BACK</button>
    </div>

    <div id="page-revenue" class="app-page">
        <div class="section-card"><h3>REVENUE</h3><textarea placeholder="Enter details..."></textarea></div>
        <button class="btn-back" onclick="openPage('dash')">BACK</button>
    </div>

    <div id="page-civil" class="app-page">
        <div class="section-card"><h3>CIVIL</h3><textarea placeholder="Enter details..."></textarea></div>
        <button class="btn-back" onclick="openPage('dash')">BACK</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBJ0zs1OCshaWKAjK6rKpYYv-zRPWNttig",
        authDomain: "garcharlawfirm.firebaseapp.com",
        databaseURL: "https://garcharlawfirm-default-rtdb.firebaseio.com",
        projectId: "garcharlawfirm",
        storageBucket: "garcharlawfirm.firebasestorage.app",
        messagingSenderId: "1056505490287",
        appId: "1:1056505490287:web:f7ae6cbbb49ba9913e169a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let mainData = {};

    function checkLogin() {
        if(document.getElementById('userInput').value === "kanji" && document.getElementById('passInput').value === "8908") {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appMain').style.display = 'block';
            startClock();
            loadData();
        } else { alert("Login Failed!"); }
    }

    function startClock() {
        setInterval(() => {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const timeStr = now.toLocaleDateString('en-GB') + " " + days[now.getDay()] + " " + now.toLocaleTimeString('en-IN', {hour12:true});
            document.getElementById('liveClock').innerText = timeStr;
        }, 1000);
    }

    function openPage(id) {
        document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id === 'dash' ? 'dash' : 'page-' + id).classList.add('active-page');
    }

    function loadData() { db.ref('cases').on('value', snap => { mainData = snap.val() || {}; renderTable(); }); }

    function addRecord() {
        const entry = {
            prev: document.getElementById('prevDate').value,
            court: document.getElementById('courtName').value,
            type: document.getElementById('caseType').value,
            caseNo: document.getElementById('caseNo').value,
            party: document.getElementById('partyName').value,
            opp: document.getElementById('oppParty').value,
            stage: document.getElementById('stage').value,
            next: document.getElementById('nextDate').value,
            phone: document.getElementById('phone').value,
            total: parseFloat(document.getElementById('totalFee').value) || 0,
            paid: parseFloat(document.getElementById('paidFee').value) || 0,
            notes: document.getElementById('caseNotes').value
        };
        db.ref('cases').push(entry).then(() => { alert("Saved!"); openPage('dash'); });
    }

    function renderTable() {
        const wrapper = document.getElementById('tableWrapper');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const fDate = document.getElementById('calFilter').value;
        wrapper.innerHTML = '';
        const grouped = {};
        Object.keys(mainData).forEach(key => {
            const i = mainData[key];
            if ((i.party.toLowerCase().includes(search)) && (!fDate || i.next === fDate)) {
                if(!grouped[i.court]) grouped[i.court] = [];
                grouped[i.court].push({key, ...i});
            }
        });
        Object.keys(grouped).sort().forEach(court => {
            let html = `<div class="court-header">COURT: ${court.toUpperCase()}</div>
                <div class="table-wrapper"><table><thead><tr>
                <th>Prev. Date</th><th>Type</th><th>No.</th><th>Party</th><th>Opp. Party</th><th>Stage</th><th>Next Date</th><th>Due</th><th>Action</th>
                </tr></thead><tbody>`;
            grouped[court].forEach(item => {
                html += `<tr><td>${item.prev}</td><td>${item.type}</td><td>${item.caseNo}</td><td><b>${item.party}</b></td>
                    <td>${item.opp}</td><td>${item.stage}</td><td style="color:red"><b>${item.next}</b></td>
                    <td>₹${item.total - item.paid}</td><td><button onclick="deleteCase('${item.key}')">DEL</button></td></tr>`;
            });
            wrapper.innerHTML += html + "</tbody></table></div>";
        });
    }

    function deleteCase(key) { if(confirm("Delete?")) db.ref('cases/' + key).remove(); }

    function exportToExcel() {
        const rows = Object.values(mainData).map(i => ({ Court: i.court, Party: i.party, Next: i.next, Balance: i.total - i.paid }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "KMG_Backup");
        XLSX.writeFile(wb, "Krisha_Data.xlsx");
    }
</script>
</body>
</html>
